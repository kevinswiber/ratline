[package]
name = "rat-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rat"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.6.4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.7"
anyhow = "1.0.104"
jiff = "0.2.35"
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"
nucleo-matcher = "0.3.1"
signal-hook = "0.4.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.26.1"
tempfile = "3"
