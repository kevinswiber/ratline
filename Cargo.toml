[package]
name = "ratto"
version = "0.7.0"
edition = "2024"
description = "Ratatui-powered terminal primitives for shell dashboards: flicker-free repaints, progress bars, prompts, and portable time tools"
license = "Apache-2.0"
authors = ["Kevin Swiber <kevin@swiber.dev>"]
homepage = "https://github.com/kevinswiber/ratto"
repository = "https://github.com/kevinswiber/ratto"
documentation = "https://docs.rs/ratto"
readme = "README.md"
keywords = ["terminal", "dashboard", "cli", "tui", "shell"]
categories = ["command-line-utilities", "command-line-interface"]

[[bin]]
name = "rat"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
# use-dev-tty: macOS kqueue cannot poll /dev/tty, which is exactly the fd
# crossterm falls back to when stdin is a pipe (`... | rat filter`). The
# feature swaps mio for a poll(2)-based reader that handles it.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
clap = { version = "4.6.4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.7"
anyhow = "1.0.104"
# Character-level diff behind watch's change markers.
dissimilar = "1"
jiff = "0.2.35"
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"
nucleo-matcher = "0.3.1"
shell-words = "1.1"
terminal-colorsaurus = "1.0"
xterm-color = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
kdl = "6.7.1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.26.1"
tempfile = "3"
