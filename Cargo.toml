[package]
name = "ratline"
version = "0.2.0"
edition = "2024"
description = "Ratatui-powered terminal primitives for shell dashboards: flicker-free repaints, progress bars, prompts, and portable time tools"
license = "Apache-2.0"
authors = ["Kevin Swiber <kevin@swiber.dev>"]
homepage = "https://github.com/kevinswiber/ratline"
repository = "https://github.com/kevinswiber/ratline"
documentation = "https://docs.rs/ratline"
readme = "README.md"
keywords = ["terminal", "dashboard", "cli", "tui", "shell"]
categories = ["command-line-utilities", "command-line-interface"]

[[bin]]
name = "rat"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
# use-dev-tty: macOS kqueue cannot poll /dev/tty, which is exactly the fd
# crossterm falls back to when stdin is a pipe (`... | rat filter`). The
# feature swaps mio for a poll(2)-based reader that handles it.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
clap = { version = "4.6.4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.7"
anyhow = "1.0.104"
jiff = "0.2.35"
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"
nucleo-matcher = "0.3.1"
signal-hook = "0.4.4"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.26.1"
tempfile = "3"
