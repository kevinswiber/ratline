# A small multi-pane dashboard: three commands, three cadences, one
# flicker-free frame. Run from a git repository:
#
#   rat dashboard examples/panes.toml
#
# The same declaration in KDL is examples/panes.kdl.

gap = 1

[defaults]
interval = "5s"
border = "rounded"
padding = "0 1"
height = 7

[[pane]]
name = "log"
command = ["git", "log", "--oneline", "-3"]
interval = "15s"

[[pane]]
name = "branch"
command = ["git", "status", "--short", "--branch"]

[[pane]]
name = "clock"
command = ["date", "+%H:%M:%S"]
interval = "1s"
height = 4

[layout]
rows = [ ["log", "branch"], "clock" ]
