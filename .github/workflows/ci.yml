name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run this workflow on demand, against any ref. Without it, a branch has
  # no way to reach CI at all — push only fires on main, so the only other
  # vehicle is opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's own earlier runs, so pushing a correction does
# not leave a stale three-OS run grinding beside it. Keyed on the branch for
# a pull request and on the run id otherwise, which means pushes to main
# never cancel each other: every commit on main gets its own verdict, and
# the release flow depends on that being true.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lint runs once, on Linux; macOS and Windows build and test.
          - { os: ubuntu-latest, gate: lint, run_tests: true }
          - { os: macos-latest, gate: build, run_tests: true }
          - { os: windows-latest, gate: check, run_tests: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Nightly rustfmt only; everything else runs on stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: just lint
        if: matrix.gate == 'lint'
        run: just lint
      - name: just build
        if: matrix.gate == 'build'
        run: just build
      - name: just check-types
        if: matrix.gate == 'check'
        run: just check-types
      - name: just test
        if: matrix.run_tests
        run: just test
